<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNCA/HNcoCA Strip Game</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  :root {
    /* Size tokens for the puzzle pane. These are the scale-1 values; fitPuzzle() rewrites them
       as resolved px for the current scale (see "size tokens" in the script). Line widths
       (1.5px borders) are deliberately NOT tokens so box alignment is the same at every scale. */
    --plot-w: 84px;
    --plot-h: 499px;          /* plot-w * 2400 / 404 : keeps the PNG aspect ratio */
    --head-h: 22px;
    --row-h: 26px;
    --chain-h: 120px; --axis-w: 56px;
    --pool-gap: 14px; --pad-r: 30px;
    --cell-font: 14px; --small-font: 12px;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #1d1d1f;
    --cell: #cfd0d4;
    --ok: #1f8a3b;
    --bad: #c62828;
    --bg: #f4f4f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 16px;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    /* Text size for titles, instructions, buttons and messages: 15px on normal screens, easing down
       to 12.5px on small or short windows (15px at 1280 wide / 860 tall, 13px at 900 wide / 640 tall).
       Everything else in the text is sized in em, so this one rule scales it all. */
    font-size: clamp(12.5px, min(calc(8.26px + 0.526vw), calc(7.18px + 0.909vh)), 15px);
    color: var(--ink); background: var(--bg);
  }
  main { max-width: 1160px; margin: 0 auto; }
  h1 { font-size: 1.47em; margin: 0 0 .27em; }
  .rule { margin: 0 0 18px; color: var(--muted); }
  .rule b { color: var(--ink); }
  .rule .red { color: #a3171f; }
  .rule + .note { margin-top: -12px; }

  .board-scroll { padding: 11.5px 0 6px; }   /* matches pool padding + border so tops line up */
  .board { position: relative; display: flex; width: max-content; padding-bottom: var(--chain-h); padding-right: var(--pad-r); }
  /* backbone chain under the strips: a newly matched shared CA snaps together */
  #links .snap { transform-box: fill-box; transform-origin: center; animation: snap .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes snap { 0% { transform: translateX(12px) scale(1.25); opacity: .6; } 100% { transform: none; opacity: 1; } }
  #links .ring { transform-box: fill-box; transform-origin: center; animation: ring .6s ease-out forwards; }
  @keyframes ring { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
  .axis { width: var(--axis-w); flex: none; position: relative; margin-top: 1.5px; }  /* matches .slots top border */
  .axis svg { position: absolute; top: var(--head-h); right: 0; overflow: visible; }
  .axis .rowlabel {
    position: absolute; right: 8px; height: var(--row-h); line-height: var(--row-h);
    font-size: var(--cell-font);
  }
  .axis .rowlabel.res { font-size: var(--small-font); right: 6px; }
  .slots { display: flex; border: 1.5px solid var(--line); border-right: 0; position: relative; }
  .slots.nope::after {   /* refused drop */
    content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: rgba(198, 40, 40, .28); outline: 3px solid var(--bad);
    animation: nope .7s ease-out forwards;
  }
  .side #status.warned { display: flex; gap: 7px; align-items: flex-start; }
  #status .warn { flex: none; margin-top: -2px; }
  #status.flash { animation: flash .9s ease-in-out; border-radius: 4px; }
  @keyframes flash { 0%, 40%, 80% { background: rgba(198, 40, 40, .18); color: var(--bad); } 20%, 60%, 100% { background: transparent; } }
  @keyframes nope { 0%, 30% { opacity: 1; } 100% { opacity: 0; } }
  .slot {
    width: calc(var(--plot-w) + 1.5px); flex: none; position: relative;
    border-right: 1.5px solid var(--line);
    min-height: calc(var(--head-h) + var(--plot-h) + 3 * var(--row-h));
  }
  .slot:empty::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,.035) 8px 16px);
  }
  .slot.next:empty::before { background: #fff; outline: 2px dashed #4a7bd0; outline-offset: -2px; }
  .slot.target { outline: 3px solid #e8a24a; outline-offset: -3px; }
  .slot.target:empty::before { background: #fff3e3; outline: 0; }   /* hovering a valid drop site */
  #links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

  .layout { display: grid; grid-template-columns: max-content max-content; gap: 28px; align-items: start;
            width: max-content; }   /* shrink-wrapped, so its size is the pane's natural size */
  .play { min-width: 0; }
  .stacked .layout { grid-template-columns: minmax(0, 1fr); }   /* chosen by fitPuzzle() when side by side won't fit */
  .pool-label { margin: 0 0 8px; font-weight: 600; }
  .board-label { margin-left: var(--axis-w); }   /* line up with the strip box, not the axis */
  .pool {
    display: flex; flex-wrap: wrap; gap: var(--pool-gap); align-content: flex-start;
    min-height: calc(var(--head-h) + var(--plot-h) + 3 * var(--row-h) + 20px);
    /* exactly five cards wide (the most it ever holds): 5 cards + 4 gaps + padding + border */
    width: calc(5 * (var(--plot-w) + 3px) + 4 * var(--pool-gap) + 20px + 3px); max-width: 100%;
    padding: 10px; border: 1.5px dashed #b9b9bd; border-radius: 10px; background: #fff;
  }
  .pool.target { border-color: #e8a24a; background: #fff3e3; }
  .pool .card { border: 1.5px solid var(--line); width: calc(var(--plot-w) + 3px); }

  .card {
    width: var(--plot-w); background: #fff; touch-action: none; user-select: none;
    cursor: grab;
  }
  .card.locked { cursor: default; }
  .card { position: relative; isolation: isolate; }
  .card::after {
    content: ""; position: absolute; left: 50%; top: var(--head-h); height: var(--plot-h);
    border-left: 1px dotted #a9a9ae; pointer-events: none; z-index: 0;
  }
  /* guide: faint dotted line at the red CA(i) shift of the right-most assembled strip, behind the plots */
  .guide .slot .card::before, .guide .pool .card::before {
    content: ""; position: absolute; left: 0; right: 0; top: calc(var(--head-h) + var(--guide-y));
    border-top: 1px dotted #a9a9ae; pointer-events: none; z-index: 0;
  }
  .card img { position: relative; z-index: 1; mix-blend-mode: multiply; }   /* white plot background lets the centre line show through */
  .card.lifted { opacity: .25; }
  .card .head { height: var(--head-h); border-bottom: 1.5px solid var(--line); }
  .card img { display: block; width: var(--plot-w); height: var(--plot-h); pointer-events: none; }
  .card .row {
    height: var(--row-h); line-height: var(--row-h); text-align: center;
    border-top: 1.5px solid var(--line); font-size: var(--cell-font); font-variant-numeric: tabular-nums;
  }
  .card .res { background: var(--cell); font-weight: 600; }
  .card .n { background: var(--cell); }
  .ghost {
    position: fixed; z-index: 10; pointer-events: none; border: 1.5px solid var(--line);
    box-shadow: 0 12px 30px rgba(0,0,0,.25); transform: rotate(1.5deg);
  }

  .top { display: flex; align-items: center; gap: 1.6em; margin-bottom: 1.2em; }
  .top .intro { flex: 0 1 auto; min-width: 0; }   /* the text wraps; the buttons always stay beside it */
  .top .rule { margin-bottom: 4px; }
  .top .rule + .note { margin-top: 0; margin-bottom: 0; }
  .controls { display: flex; gap: .67em; flex: none; }
  .side #status { display: block; margin-top: 14px; width: 0; min-width: 100%;   /* never widens the column */
                  min-height: calc(4 * 1.45em); }   /* room for the longest message, so the fitted pane never grows */
  button {
    font: inherit; font-weight: 600; padding: .53em 1.07em; border-radius: .53em;
    border: 1.5px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  #status { color: var(--muted); }
  .key { white-space: nowrap; margin-left: 4px; font-size: 1.1em; }
  .key .blk { color: #1d1d1f; }
  #status.ok { color: var(--ok); font-weight: 600; }
  #status.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>HNCA/HNcoCA strip game</h1>
  <header class="top">
  <div class="intro">
  <p class="rule">Connect the <b>black</b> <i>i</i>&#8209;1 peak on the right to the <b class="red">red</b> <i>i</i> peak on the left.
    <span class="key"><span class="red">●</span>&thinsp;←&thinsp;<span class="blk">●</span></span></p>
  <p class="rule note">In each strip the black HNcoCA <i>i</i>&#8209;1 peak overlaps the HNCA <i>i</i>&#8209;1 peak;
    the red peak on its own is the HNCA <i>i</i> peak.</p>
  </div>
  <div class="controls">
    <button id="hint">Hint</button>
    <button id="reset">Start again</button>
  </div>
  </header>

  <div class="layout">
    <div class="play">
      <div class="pool-label board-label">Assembled strips</div>
      <div class="board-scroll">
        <div class="board" id="board">
          <div class="axis" id="axis"></div>
          <div class="slots" id="slots"></div>
          <svg id="links"></svg>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="pool-label">Strips to place</div>
      <div class="pool" id="pool"></div>
      <span id="status">Loading Python…</span>
    </div>
  </div>
</main>

<script type="text/x-python" id="game-py">
import json

# 13C shifts of the assigned peaks, measured from the peak centres in assets/*.png (tools/measure_peaks.py)
# ca_i   : red HNCA peak (this residue's CA)
# ca_im1 : black HNcoCA peak (previous residue's CA)
STRIPS = {
    "red":     dict(hn=8.939, n=121.01, ca_i=58.95, ca_im1=60.77, residue="ASP", number=130),
    "blue":    dict(hn=8.346, n=116.43, ca_i=57.29, ca_im1=58.84, residue="ASP", number=131),
    "green":   dict(hn=7.526, n=120.96, ca_i=55.37, ca_im1=57.34, residue="ASN", number=132),
    "orange":  dict(hn=8.963, n=122.49, ca_i=66.98, ca_im1=55.42, residue="ILE", number=133),
    "crimson": dict(hn=7.793, n=117.06, ca_i=56.60, ca_im1=66.89, residue="ASN", number=134),
    "cyan":    dict(hn=7.821, n=118.66, ca_i=65.61, ca_im1=56.58, residue="ILE", number=135),
}
SOLUTION = ["red", "blue", "green", "orange", "crimson", "cyan"]
TOLERANCE = 0.3  # ppm


def strip_info():
    return json.dumps({k: dict(hn=v["hn"], n=v["n"], ca_i=v["ca_i"], ca_im1=v["ca_im1"])
                       for k, v in STRIPS.items()})


def link(left, right):
    a, b = STRIPS[left]["ca_i"], STRIPS[right]["ca_im1"]
    return dict(left=left, right=right, ca_i=a, ca_im1=b, match=abs(a - b) <= TOLERANCE)


def check(order_json):
    order = json.loads(order_json)
    links = [link(l, r) if l and r else None for l, r in zip(order, order[1:])]
    filled = all(order)
    solved = filled and all(k["match"] for k in links)
    bad = sum(1 for k in links if k and not k["match"])
    return json.dumps(dict(links=links, filled=filled, solved=solved, bad=bad))


def hint():
    return SOLUTION[1]
</script>

<script>
const PPM_TOP = 49.8, PPM_BOTTOM = 71.0;       // range covered by assets/*.png
const COLOURS = { red: "#ed1c24", blue: "#2e3092", green: "#00a650",
                  orange: "#f7941d", crimson: "#be1e2d", cyan: "#00aeef" };
const START = "red";
const ASSET_VERSION = 2;   // bump when assets/*.png are rebuilt so browsers refetch them
const N_SLOTS = 6;

const $ = id => document.getElementById(id);
let py = null, STRIPS = null, hintUsed = false, solved = false;

/* ---------- size tokens: one scale factor S sizes the puzzle's boxes ----------
   Every structural size is derived from S and written to :root as resolved px, so layout,
   getBoundingClientRect(), elementFromPoint() and the SVG overlays share one coordinate system
   (no zoom/transform). Drawing code reads sizes via cssPx() and scales its own marks by S. */
const BASE = { "head-h": 22, "row-h": 26, "chain-h": 120, "axis-w": 56, "pool-gap": 14, "pad-r": 30,
               "cell-font": 14, "small-font": 12 };
const PLOT_W = 84, PLOT_ASPECT = 2400 / 404;   // strip PNG aspect ratio
const S_MIN = 0.55, S_MIN_STACKED = 0.4;
let S = 1;
function applyScale(k) {
  S = k;
  const root = document.documentElement.style;
  for (const [name, v] of Object.entries(BASE)) root.setProperty(`--${name}`, `${(v * k).toFixed(2)}px`);
  const w = Math.round(PLOT_W * k);            // whole px so the 1.5px borders stay crisp
  root.setProperty("--plot-w", `${w}px`);
  root.setProperty("--plot-h", `${Math.round(w * PLOT_ASPECT)}px`);
}

/* Fit the puzzle pane into the space it is given: the width of <main> and the window height
   below the pane's top. Text outside the pane doesn't scale, so pane size is affine in S;
   measure it at two scales, solve for the S that fits, then nudge down if anything overflows.
   If side by side would need S < S_MIN, stack the strips to place under the board and fit width only.
   (Further panes can reuse this: give each its container and its own token root.) */
function fitPuzzle() {
  const pane = document.querySelector(".layout"), main = document.querySelector("main");
  const availW = () => main.clientWidth;
  const availH = () => innerHeight - (pane.getBoundingClientRect().top + scrollY) -
                       parseFloat(getComputedStyle(document.body).paddingBottom);
  const size = k => { applyScale(k); return [pane.offsetWidth, pane.offsetHeight]; };
  const solve = (fitHeight) => {
    const [w1, h1] = size(1), [w0, h0] = size(0.5);
    const kFor = (avail, v1, v0) => {   // v(k) = a + b k  through (0.5, v0) and (1, v1)
      const b = (v1 - v0) / 0.5;
      return b > 0 ? (avail - (v1 - b)) / b : 1;
    };
    let k = Math.min(1, kFor(availW(), w1, w0));
    if (fitHeight) k = Math.min(k, kFor(availH(), h1, h0));
    return k;
  };
  const overflows = (fitHeight) => pane.offsetWidth > availW() + 0.5 || (fitHeight && pane.offsetHeight > availH() + 0.5);

  document.body.classList.remove("stacked");
  let k = solve(true), fitHeight = true, floor = S_MIN;
  if (k < S_MIN) {
    document.body.classList.add("stacked");
    k = solve(false); fitHeight = false; floor = S_MIN_STACKED;
  }
  k = Math.max(floor, k);
  applyScale(k);
  for (let i = 0; i < 20 && k > floor && overflows(fitHeight); i++) applyScale(k = Math.max(floor, k - 0.01));
}

const cssPx = name => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
const plotH = () => cssPx("--plot-h");
const ppmToY = ppm => (ppm - PPM_TOP) / (PPM_BOTTOM - PPM_TOP) * plotH();

function drawAxis() {
  const h = plotH(), head = cssPx("--head-h"), row = cssPx("--row-h");
  const W = 30 * S, f = 13 * S;
  let s = `<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">`;
  for (let p = 50; p <= 70; p++) {
    const y = ppmToY(p), major = p % 5 === 0;
    s += `<line x1="${(major ? 16 : 22) * S}" x2="${W}" y1="${y}" y2="${y}" stroke="#1d1d1f" stroke-width="1.2"/>`;
    if (major) s += `<text x="${12 * S}" y="${y + f * 0.35}" text-anchor="end" font-size="${f}" fill="#1d1d1f">${p}</text>`;
  }
  s += `</svg>`;
  const top = head + h;
  $("axis").innerHTML = s +
    `<div style="position:absolute;left:-2px;top:${head + h / 2}px;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font-size:${f}px;white-space:nowrap">
       <sup>13</sup>C<sub>α</sub> (ppm)</div>` +
    `<div class="rowlabel res" style="top:${top}px">residue</div>` +
    `<div class="rowlabel" style="top:${top + row}px"><sup>1</sup>H</div>` +
    `<div class="rowlabel" style="top:${top + 2 * row}px"><sup>15</sup>N</div>`;
}

function makeCard(id) {
  const s = STRIPS[id];
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.id = id;
  el.innerHTML = `
    <div class="head" style="background:${COLOURS[id]}"></div>
    <img src="assets/${id}.png?v=${ASSET_VERSION}" alt="HNCA strip" draggable="false">
    <div class="row res">???</div>
    <div class="row">${s.hn.toFixed(3)}</div>
    <div class="row n">${s.n.toFixed(2)}</div>`;
  el.addEventListener("pointerdown", startDrag);
  return el;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newGame() {
  solved = false;   // hintUsed is NOT reset: one hint per visit, "Start again" doesn't give another
  $("hint").disabled = hintUsed;
  $("slots").innerHTML = "";
  $("pool").innerHTML = "";
  for (let i = 0; i < N_SLOTS; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.index = i;
    $("slots").append(slot);
  }
  placeLocked(START, 0);
  shuffle(Object.keys(STRIPS).filter(k => k !== START)).forEach(k => $("pool").append(makeCard(k)));
  if (hintUsed) placeLocked(py.globals.get("hint")(), 1);   // the hint, once given, stays given
  refresh();
}

function placeLocked(id, index) {
  const slot = $("slots").children[index];
  const existing = slot.querySelector(".card");
  if (existing) $("pool").append(existing);
  const card = document.querySelector(`.card[data-id="${id}"]`) || makeCard(id);
  card.classList.add("locked");
  slot.dataset.locked = "1";
  slot.append(card);
}

function order() {
  return [...$("slots").children].map(s => s.querySelector(".card")?.dataset.id ?? null);
}

/* ---------- dragging (pointer events: mouse + touch) ---------- */
let drag = null;

function startDrag(e) {
  const card = e.currentTarget;
  if (card.classList.contains("locked") || solved || !py) return;
  if (card.parentElement.classList.contains("slot") && card.parentElement !== lastFilledSlot()) return;
  e.preventDefault();
  const r = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add("ghost");
  ghost.style.left = r.left + "px";
  ghost.style.top = r.top + "px";
  document.body.append(ghost);
  card.classList.add("lifted");
  drag = { card, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, target: null };
  window.addEventListener("pointermove", moveDrag);
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
}

function nextSlot() {
  return [...$("slots").children].find(s => !s.querySelector(".card")) ?? null;
}

function lastFilledSlot() {
  return [...$("slots").children].filter(s => s.querySelector(".card")).pop() ?? null;
}

let blocked = false;   // a bad connection is on the board: no more strips until it is removed
function dropTargetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const slot = el?.closest(".slot");
  if (slot) return blocked || slot.querySelector(".card") ? null : nextSlot();   // any empty slot drops into the next free one
  return el?.closest(".pool") ?? null;
}

function moveDrag(e) {
  drag.ghost.style.left = e.clientX - drag.dx + "px";
  drag.ghost.style.top = e.clientY - drag.dy + "px";
  const t = dropTargetAt(e.clientX, e.clientY);
  if (t !== drag.target) {
    drag.target?.classList.remove("target");
    t?.classList.add("target");
    drag.target = t;
  }
}

function endDrag(e) {
  window.removeEventListener("pointermove", moveDrag);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", endDrag);
  const { card, ghost, target } = drag;
  ghost.remove();
  card.classList.remove("lifted");
  target?.classList.remove("target");
  drag = null;
  if (!target) {   // let go over the assembled strips where a strip can't go: flash them red
    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest(".slots");
    if (over && document.elementFromPoint(e.clientX, e.clientY).closest(".slot") !== card.parentElement) flashNope();
    return;
  }
  if (target === card.parentElement) return;

  target.append(card);
  refresh();
}

function flashNope() {
  for (const [id, cls] of [["slots", "nope"], ["status", "flash"]]) {
    const el = $(id);
    el.classList.remove(cls);
    void el.offsetWidth;   // restart the animation if it is already running
    el.classList.add(cls);
  }
}

/* ---------- connectors ---------- */
function peakXY(id, ppm, boardRect) {
  const img = document.querySelector(`.slot .card[data-id="${id}"] img`).getBoundingClientRect();
  return { x: img.left - boardRect.left + img.width * 0.49, y: img.top - boardRect.top + ppmToY(ppm), w: img.width };
}

function drawLinks(links, complete) {
  const board = $("board"), svg = $("links");
  const br = board.getBoundingClientRect();
  svg.setAttribute("width", br.width);
  svg.setAttribute("height", br.height);
  const ry = 0.9 * plotH() / (PPM_BOTTOM - PPM_TOP);
  // green links point backwards: from the black CA(i-1) peak on the right to the red CA(i) peak on the left
  let s = `<defs><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2"
             orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${getVar("--ok")}"/></marker></defs>`;
  const circle = (p) =>
    `<ellipse cx="${p.x}" cy="${p.y}" rx="${p.w * 0.27}" ry="${ry}" fill="rgba(120,120,125,.18)"
              stroke="#1d1d1f" stroke-width="1.6" stroke-dasharray="1.6 2.4"/>`;
  const ok = getVar("--ok");
  const ends = {};   // per strip: its green-linked black (CA(i-1)) and red (CA(i)) circle centres
  const end = (id, key, p) => ((ends[id] ??= {})[key] = p);
  const first = order()[0];
  if (first) {   // first strip: its black CA(i-1) peak leads off to the (unseen) previous residue
    const p = peakXY(first, STRIPS[first].ca_im1, br), x0 = p.x - p.w * 0.49;
    end(first, "im1", p);
    s += circle(p) + `<line x1="${x0}" x2="${p.x - p.w * 0.27}" y1="${p.y}" y2="${p.y}"
                        stroke="${getVar("--ok")}" stroke-width="2.5" stroke-linecap="round" marker-start="url(#back)"/>`;
  }
  const last = order()[N_SLOTS - 1];
  if (complete && last) {   // last strip: its red CA(i) peak leads off to the (unseen) next residue
    const q = peakXY(last, STRIPS[last].ca_im1, br), p = peakXY(last, STRIPS[last].ca_i, br);
    end(last, "im1", q); end(last, "i", p);
    s += circle(q) + circle(p) + `<line x1="${p.x + p.w * 0.27}" x2="${p.x + p.w * 0.51}" y1="${p.y}" y2="${p.y}"
                        stroke="${getVar("--ok")}" stroke-width="2.5" stroke-linecap="round" marker-start="url(#back)"/>`;
  }
  for (const k of links) {
    if (!k) continue;
    const a = peakXY(k.left, k.ca_i, br), b = peakXY(k.right, k.ca_im1, br);
    if (k.match) a.y = b.y = (a.y + b.y) / 2;   // matched peaks share one shift: keep the link level
    s += circle(a) + circle(b);
    if (k.match) {
      end(k.left, "i", a); end(k.right, "im1", b);
      s += `<line x1="${a.x + a.w * 0.27}" x2="${b.x - b.w * 0.27}" y1="${a.y}" y2="${b.y}"
                  stroke="${getVar("--ok")}" stroke-width="2.5" stroke-linecap="round" marker-start="url(#back)"/>`;
    } else {
      // no partner either way: each peak's dashed search line ends in a dot coloured like the peak
      const bad = getVar("--bad"), xa = b.x, xb = a.x;
      const dash = (x1, x2, y) => `<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}"
                  stroke="${bad}" stroke-width="2" stroke-dasharray="5 4"/>`;
      const dot = (x, y, fill) => `<circle cx="${x}" cy="${y}" r="${9 * S}" fill="${fill}" stroke="#fff" stroke-width="1.6"/>`;
      s += dash(a.x + a.w * 0.27, xa, a.y) + dot(xa, a.y, "#ed1c24")     // red CA(i) looking right
         + dash(b.x - b.w * 0.27, xb, b.y) + dot(xb, b.y, "#1d1d1f");    // black CA(i-1) looking left
    }
  }
  for (const e of Object.values(ends)) {   // walk down the strip: black peak to red peak
    if (!e.i || !e.im1) continue;
    const dir = Math.sign(e.i.y - e.im1.y), y1 = e.im1.y + dir * ry, y2 = e.i.y - dir * ry;
    if (dir && (y2 - y1) * dir > 0)
      s += `<line x1="${e.im1.x}" x2="${e.im1.x}" y1="${y1}" y2="${y2}"
                  stroke="${ok}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  s += drawChain(links, complete, br);
  svg.innerHTML = s;
}

/* Backbone under the assembled strips. Each strip is one HNCA "view" of the amide N(i)-H:
   CA(i-1) - C'(i-1)(=O) - N(i)(-H) - CA(i), drawn as a 120-degree zigzag whose CA atoms sit on
   the strip edges, so neighbouring strips share a CA: the left strip's red CA(i) is the right
   strip's black CA(i-1). When the shifts match the two click together into one atom. */
let snapped = new Set();   // matched pairs already shown, so only new ones animate
function drawChain(links, complete, br) {
  const ids = order(), slots = [...$("slots").children];
  const sr = $("slots").getBoundingClientRect();
  const yMid = sr.bottom - br.top + cssPx("--chain-h") / 2;
  const ink = "#1d1d1f", red = "#ed1c24", nBlue = "#2c5aa0";
  const bond = (x1, y1, x2, y2, extra = "") =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="1.6" stroke-linecap="round" ${extra}/>`;
  const label = (x, y, t, fill = ink) =>
    `<circle cx="${x}" cy="${y}" r="${7.5 * S}" fill="#fff"/>
     <text x="${x}" y="${y + 4.5 * S}" text-anchor="middle" font-size="${13 * S}" font-weight="600" fill="${fill}">${t}</text>`;
  const ca = (x, y, fill, cls = "") =>
    `<g class="${cls}"><circle cx="${x}" cy="${y}" r="${9 * S}" fill="${fill}" stroke="#fff" stroke-width="1.2"/>
     <text x="${x}" y="${y + 3.5 * S}" text-anchor="middle" font-size="${9.5 * S}" font-weight="700" fill="#fff">Cα</text></g>`;
  const R = 10 * S;
  const merged = (x, y, fresh) =>   // one atom seen from both strips: red half (HNCA i) + black half (HNcoCA i-1)
    `${fresh ? `<circle class="ring" cx="${x}" cy="${y}" r="${R}" fill="none" stroke="${getVar("--ok")}" stroke-width="2.5"/>` : ""}
     <g class="${fresh ? "snap" : ""}">
       <path d="M${x},${y - R} A${R},${R} 0 0 0 ${x},${y + R} Z" fill="${red}"/>
       <path d="M${x},${y - R} A${R},${R} 0 0 1 ${x},${y + R} Z" fill="${ink}"/>
       <circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="${getVar("--ok")}" stroke-width="2"/>
       <text x="${x}" y="${y + 3.5 * S}" text-anchor="middle" font-size="${9.5 * S}" font-weight="700" fill="#fff">Cα</text></g>`;

  let bonds = "", atoms = "";
  const now = new Set();
  ids.forEach((id, k) => {
    if (!id) return;
    const r = slots[k].getBoundingClientRect();
    const xL = r.left - br.left - 0.75, xR = r.right - br.left - 0.75, dx = (xR - xL) / 3;
    const dy = dx * Math.tan(Math.PI / 6), up = k % 2 ? 1 : -1;    // zigzag flips each residue
    const y = j => yMid + (j % 2 ? up : -up) * dy / 2;             // atoms 0..3: CA(i-1), C', N, CA(i)
    const X = j => xL + j * dx;
    const bl = Math.hypot(dx, dy);
    const leftLink = k > 0 ? links[k - 1] : null, rightLink = links[k] ?? null;
    // CAs sit on the strip edges. Matched neighbours share one atom; a mismatch splits it into
    // two atoms side by side on the edge, red CA(i) left and black CA(i-1) right, with a warning sign.
    const SPLIT = 9 * S, split = l => !!l && !l.match;
    const xa = X(0) + (split(leftLink) ? SPLIT : 0), xb = X(3) - (split(rightLink) ? SPLIT : 0);
    const ya = y(0), yb = y(3);
    bonds += bond(xa, ya, X(1), y(1)) + bond(X(1), y(1), X(2), y(2)) + bond(X(2), y(2), xb, yb);
    // C'=O (double bond, outwards) and N-H (outwards, trans to the O)
    const oy = y(1) + up * bl * 0.8, hy = y(2) - up * bl * 0.7;
    const db = 2.2 * S;   // half-spacing of the C=O double bond
    bonds += bond(X(1) - db, y(1), X(1) - db, oy) + bond(X(1) + db, y(1), X(1) + db, oy) + bond(X(2), y(2), X(2), hy);
    atoms += label(X(1), y(1), "C") + label(X(1), oy, "O") + label(X(2), y(2), "N", nBlue) + label(X(2), hy, "H");
    if (k === 0)   // previous residue not shown: dangling bond
      bonds += bond(xa, y(0), xa - dx * 0.8, y(0) + up * dy * 0.8, `stroke-dasharray="3 3" opacity=".6"`);
    if (!leftLink || split(leftLink)) atoms += ca(xa, ya, ink);
    if (rightLink?.match) {   // one shared CA, half red (HNCA i) and half black (HNcoCA i-1)
      const key = `${id}>${rightLink.right}`;
      now.add(key);
      atoms += merged(xb, yb, !snapped.has(key));
    } else if (rightLink) {   // shifts don't match: separate atoms plus a warning sign, away from the bonds
      atoms += ca(xb, yb, red) +
        `<g transform="translate(${X(3) - 12 * S} ${y(3) + (up * 27 - 12) * S}) scale(${S})">${warnSign()}</g>`;
    } else {
      atoms += ca(xb, y(3), red);
      if (k === N_SLOTS - 1 && complete)   // next residue not shown
        bonds += bond(xb, y(3), xb + dx * 0.8, y(3) - up * dy * 0.8, `stroke-dasharray="3 3" opacity=".6"`);
    }
  });
  snapped = now;
  return bonds + atoms;
}
/* Warning sign (rounded triangle with "!") in a 28x28 box from -2,-2: used in the chain and the status message */
function warnSign() {
  const bad = getVar("--bad"), P = [[12, -0.2], [24.6, 22.2], [-0.6, 22.2]], r = 3.5;
  let d = "";
  P.forEach((p, i) => {   // cut each corner back by r along both edges and round it with a curve
    const a = P[(i + 2) % 3], b = P[(i + 1) % 3];
    const toward = (q) => { const l = Math.hypot(q[0] - p[0], q[1] - p[1]); return [p[0] + (q[0] - p[0]) * r / l, p[1] + (q[1] - p[1]) * r / l]; };
    const s = toward(a), e = toward(b);
    d += `${i ? "L" : "M"}${s[0].toFixed(2)},${s[1].toFixed(2)} Q${p[0]},${p[1]} ${e[0].toFixed(2)},${e[1].toFixed(2)} `;
  });
  return `<path d="${d}Z" fill="#fff" stroke="${bad}" stroke-width="2.4" stroke-linejoin="round"/>
          <rect x="10.8" y="8.5" width="2.4" height="7" rx="1.2" fill="${bad}"/>
          <circle cx="12" cy="18" r="1.4" fill="${bad}"/>`;
}
const getVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- game state via Python ---------- */
function setStatus(text, cls = "", warn = false) {
  $("status").textContent = text;
  if (warn) {   // icon in its own column so the wrapped lines hang-indent past it
    $("status").innerHTML = `<svg class="warn" width="22" height="22" viewBox="-2 -2 28 28" aria-hidden="true">${warnSign()}</svg><span></span>`;
    $("status").lastChild.textContent = text;
    cls += " warned";
  }
  $("status").className = cls;
}

function refresh() {
  if (!py) return;
  const r = JSON.parse(py.globals.get("check")(JSON.stringify(order())));
  drawLinks(r.links, r.solved);
  blocked = r.bad > 0;
  const last = order().filter(Boolean).pop();
  document.body.classList.toggle("guide", !!last && !r.solved);
  if (last) document.documentElement.style.setProperty("--guide-y", `${ppmToY(STRIPS[last].ca_i)}px`);
  const next = blocked ? null : nextSlot();
  [...$("slots").children].forEach(s => s.classList.toggle("next", s === next));
  if (r.solved) {
    solved = true;
    document.querySelectorAll(".slot .card").forEach(c => c.classList.add("locked"));
    $("hint").disabled = true;
    setStatus("All six strips are connected!", "ok");
  } else if (r.bad) {
    setStatus("These strips don't connect: the red peak has no black partner and the black peak no red partner. " +
              "Drag the last strip back to the right before adding another.", "bad", true);
  } else {
    const placed = order().filter(Boolean).length;
    setStatus(`${placed} of ${N_SLOTS} strips placed — drag a strip from the right into the next empty slot.`);
  }
}

$("hint").addEventListener("click", () => {
  if (hintUsed || !py) return;
  hintUsed = true;
  $("hint").disabled = true;
  [...$("slots").children].slice(1).forEach(s => s.querySelector(".card") && $("pool").append(s.querySelector(".card")));
  placeLocked(py.globals.get("hint")(), 1);
  refresh();
});
$("reset").addEventListener("click", () => py && newGame());
let resizeQueued = false;
window.addEventListener("resize", () => {
  if (resizeQueued || !py) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; relayout(); });
});
function relayout() {   // sizes changed: refit, then redraw everything that is drawn from sizes
  fitPuzzle();
  drawAxis();
  refresh();
}

async function main() {
  py = await loadPyodide();
  py.runPython($("game-py").textContent);
  STRIPS = JSON.parse(py.globals.get("strip_info")());
  newGame();
  relayout();
}
main().catch(err => setStatus("Could not load Python (Pyodide): " + err.message, "bad"));
</script>
